name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  build:
    name: build
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      RUN_REAL_PROVIDER_E2E: "0"
    steps:
      - name: Check out source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
      - name: Install uv and Python
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          enable-cache: true
          python-version: "3.14"
      - name: Install Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: "22.19.0"
      - name: Install Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.4.0"
      - name: Install locked dependencies
        run: |
          uv sync --extra dev --locked
          bun install --frozen-lockfile
      - name: Verify tag and source
        run: |
          git fetch --no-tags origin main:refs/remotes/origin/main
          git merge-base --is-ancestor "$GITHUB_SHA" refs/remotes/origin/main
          test "$GITHUB_REF_NAME" = "v$(uv version --short)"
          uv run pytest tests/ -v
          uv run ruff check src tests
          bun test packages/
          bun run typecheck
      - name: Build release archives
        run: |
          bun run build
          uv build
          mkdir -p release-artifacts/npm
          npm pack --workspace packages/agent-tools-pi --pack-destination release-artifacts/npm
          npm pack --workspace packages/agent-tools-dsh --pack-destination release-artifacts/npm
          sha256sum dist/*.tar.gz dist/*.whl release-artifacts/npm/*.tgz > release-artifacts/SHA256SUMS
      - name: Retain source release artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: source-release-artifacts
          path: |
            dist/*.tar.gz
            dist/*.whl
            release-artifacts/npm/*.tgz
            release-artifacts/SHA256SUMS
          if-no-files-found: error
          retention-days: 30

  github-release:
    name: github-release
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Download verified archives
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: source-release-artifacts
          path: release-bundle
      - name: Create immutable GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            release-bundle/dist/*.tar.gz \
            release-bundle/dist/*.whl \
            release-bundle/release-artifacts/npm/*.tgz \
            release-bundle/release-artifacts/SHA256SUMS \
            --verify-tag \
            --generate-notes \
            --title "$GITHUB_REF_NAME"

  pypi-publish:
    name: pypi-publish
    if: ${{ vars.ENABLE_PYPI_PUBLISH == 'true' }}
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: pypi
      url: https://pypi.org/project/quant-trade-agent-tools/
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Download verified archives
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: source-release-artifacts
          path: release-bundle
      - name: Publish with PyPI Trusted Publishing
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1
        with:
          packages-dir: release-bundle/dist/

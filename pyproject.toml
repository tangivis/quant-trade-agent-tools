[project]
name = "quant-trade-agent-tools"
version = "0.3.1"
description = "Independent multi-harness, multi-model agent tools for quant_trade"
readme = "README.md"
license = { text = "MIT" }
authors = [
    { name = "quant_trade contributors" }
]
requires-python = ">=3.12"
keywords = [
    "quant-trading",
    "trading-agent",
    "mcp",
    "cli",
    "9984",
    "softbank",
    "japan",
    "llm",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Financial and Insurance Industry",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Office/Business :: Financial :: Investment",
]
dependencies = [
    "click>=8.1.7",
    "httpx>=0.28.1",
    "mcp>=2,<3",
]

[project.optional-dependencies]
gateway = [
    "fastapi>=0.115,<1",
    "uvicorn>=0.34,<1",
]
dev = [
    "fastapi>=0.115,<1",
    "pytest>=8.0.0",
    "pytest-asyncio>=1.0.0",
    "uvicorn>=0.34,<1",
]

[project.urls]
"pi" = "https://github.com/earendil-works/pi"

[project.scripts]
agent-tools = "agent_tools.cli:main"
quant-trade-agent-tools = "agent_tools.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agent_tools"]

[tool.hatch.build.targets.wheel.force-include]
"openapi/agent-gateway-v1.json" = "agent_tools/openapi/agent-gateway-v1.json"

[tool.hatch.build.targets.sdist]
include = [
    "/src/agent_tools",
    "/tests",
    "/LICENSE",
    "/README.md",
    "/ARCHITECTURE.md",
    "/SECURITY.md",
    "/CHANGELOG.md",
    "/openapi",
    "/pyproject.toml",
]

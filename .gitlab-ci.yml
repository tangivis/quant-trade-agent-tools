default:
  timeout: 30m

stages:
  - test
  - package
  - publish

variables:
  GIT_CLEAN_FLAGS: -ffdx -e node_modules/
  UV_PYTHON: "3.14"

test:
  stage: test
  before_script:
    - export PATH="$HOME/.local/bin:$(mise where node)/bin:$(mise where bun)/bin:$PATH"
  script:
    - uv sync --extra dev
    - uv run pytest tests/ -v
    - uv run ruff check src tests
    - bun install --frozen-lockfile
    - bun test packages/
    - bun run typecheck
    - bun run build
    - uv build
    - npm pack --dry-run --json --workspace @quant-trade/agent-tools-pi
    - npm pack --dry-run --json --workspace @quant-trade/agent-tools-dsh
    - 'if [ -n "${CI_COMMIT_TAG:-}" ]; then test "$CI_COMMIT_TAG" = "v$(uv version --short)"; fi'
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == "develop"
    - if: $CI_COMMIT_BRANCH == "main"
    - if: $CI_COMMIT_BRANCH =~ /^feature\//
    - if: $CI_COMMIT_BRANCH =~ /^hotfix\//
    - if: $CI_COMMIT_TAG =~ /^v/

source-release-artifacts:
  stage: package
  before_script:
    - export PATH="$HOME/.local/bin:$(mise where node)/bin:$(mise where bun)/bin:$PATH"
  script:
    - uv sync --extra dev
    - bun install --frozen-lockfile
    - bun run build
    - uv build
    - mkdir -p release-artifacts/npm
    - npm pack --workspace @quant-trade/agent-tools-pi --pack-destination release-artifacts/npm
    - npm pack --workspace @quant-trade/agent-tools-dsh --pack-destination release-artifacts/npm
  artifacts:
    name: "agent-tools-${CI_COMMIT_TAG}-source-artifacts"
    paths:
      - dist/*.tar.gz
      - dist/*.whl
      - release-artifacts/npm/*.tgz
    expire_in: 30 days
  rules:
    - if: '$CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+$/'
  needs:
    - test

agent-tools-python-publish:
  stage: publish
  before_script:
    - export PATH="$HOME/.local/bin:$(mise where node)/bin:$(mise where bun)/bin:$PATH"
  script:
    - 'uv publish --token "${PYPI_TOKEN}" dist/*'
  rules:
    - if: '$CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+$/ && $ENABLE_PYPI_PUBLISH == "true" && $PYPI_TOKEN'
    - when: never
  needs:
    - job: source-release-artifacts
      artifacts: true

agent-tools-npm-publish-pi:
  stage: publish
  before_script:
    - export PATH="$HOME/.local/bin:$(mise where node)/bin:$(mise where bun)/bin:$PATH"
    - export NPM_CONFIG_USERCONFIG="$CI_PROJECT_DIR/.npmrc.ci"
  script:
    - 'npm publish --access public --tag latest release-artifacts/npm/quant-trade-agent-tools-pi-*.tgz'
  rules:
    - if: '$CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+$/ && $ENABLE_NPM_PUBLISH == "true" && $NPM_TOKEN'
    - when: never
  needs:
    - job: source-release-artifacts
      artifacts: true

agent-tools-npm-publish-dsh:
  stage: publish
  before_script:
    - export PATH="$HOME/.local/bin:$(mise where node)/bin:$(mise where bun)/bin:$PATH"
    - export NPM_CONFIG_USERCONFIG="$CI_PROJECT_DIR/.npmrc.ci"
  script:
    - 'npm publish --access public --tag experimental release-artifacts/npm/quant-trade-agent-tools-dsh-*.tgz'
  rules:
    - if: '$CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+$/ && $ENABLE_NPM_PUBLISH == "true" && $NPM_TOKEN'
    - when: never
  needs:
    - job: source-release-artifacts
      artifacts: true
